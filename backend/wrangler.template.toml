name = "distro-indicators"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/15 * * * *"]

[vars]
SNAPSHOT_KEY = "snapshot.json"

[[routes]]
pattern = "api.example.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "distro-indicators"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "REPLACE_WITH_YOUR_KV_ID"
